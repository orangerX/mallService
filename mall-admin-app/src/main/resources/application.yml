server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  application:
    name: mall-admin-app
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mall_service?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    database: ${REDIS_DATABASE:0}
    timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mall.admin.model,com.mall.address.model,com.mall.cart.model,com.mall.coupon.model,com.mall.order.model,com.mall.product.model,com.mall.user.model
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

app:
  admin:
    jwt:
      secret: ${ADMIN_JWT_SECRET}
      audience: mall-admin
      access-token-ttl: PT30M
      refresh-token-ttl: PT168H

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
